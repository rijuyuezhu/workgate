name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui-terminal/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pyright

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest -q -m "not topology"

  topology:
    name: Deployment topology
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev --extra s3
      - name: Run real-process deployment topologies
        run: uv run pytest -q -m topology --basetemp=topology-artifacts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: deployment-topology-logs
          path: topology-artifacts
          if-no-files-found: ignore
          retention-days: 14

  coverage:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Install locked Chromium revision
        run: uv run playwright install --with-deps chromium
      - name: Run branch coverage
        run: |
          find . -maxdepth 1 -name '.coverage*' -delete
          uv run python -m coverage run -m pytest -q -m "not topology"
          uv run python -m coverage combine
          uv run python -m coverage json
          uv run python -m coverage xml
          uv run python -m coverage report
          uv run python scripts/validation/check-coverage.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-coverage
          path: |
            coverage.json
            coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  browser-e2e:
    name: Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install terminal runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux
      - run: uv sync --locked --group dev
      - name: Install locked Chromium revision
        run: uv run playwright install --with-deps chromium
      - name: Run structured browser tool E2E
        run: uv run pytest -q -m browser tests/test_browser_service.py
      - name: Run real Chromium Human UI scenario
        run: uv run python scripts/testing/run-browser-e2e.py --artifacts browser-artifacts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: chromium-human-ui-e2e
          path: browser-artifacts
          if-no-files-found: warn
          retention-days: 14

  windows-conpty:
    name: Windows ConPTY
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: >-
          uv run pytest -q
          tests/test_conpty_backend.py
          tests/test_conpty_windows_integration.py
          tests/test_terminal_bridge.py

  package-smoke:
    name: Package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv build --out-dir dist
      - name: Check universal wheel and source distribution
        run: python scripts/validation/check-python-dist.py dist
      - name: Validate source distribution contents and rebuild
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/workgate-sdist /tmp/workgate-sdist-wheel
          mkdir -p /tmp/workgate-sdist /tmp/workgate-sdist-wheel
          tar -xzf dist/*.tar.gz -C /tmp/workgate-sdist
          source_dir="$(find /tmp/workgate-sdist -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test ! -e "$source_dir/scripts/release/pyinstaller-entry.py"
          test ! -e "$source_dir/scripts/pyinstaller-entry.py"
          test ! -e "$source_dir/scripts/testing/run-browser-e2e.py"
          test ! -e "$source_dir/scripts/run-browser-e2e.py"
          test -f "$source_dir/scripts/README.md"
          test -f "$source_dir/scripts/validation/check-coverage.py"
          test -f "$source_dir/scripts/validation/check-release-matrix.py"
          test -f "$source_dir/scripts/validation/check-python-dist.py"
          test -f "$source_dir/deploy/cloudflared/README.md"
          test -f "$source_dir/deploy/cloudflared/workgate-cloudflared.service"
          test -f "$source_dir/scripts/validation/coverage-baseline.json"
          test -f "$source_dir/tests/test_coverage_gate.py"
          test -f "$source_dir/tests/test_tmux_helper.py"
          test ! -e "$source_dir/.coverage"
          test ! -e "$source_dir/coverage.json"
          test ! -e "$source_dir/coverage.xml"
          test -f "$source_dir/ui-terminal/package.json"
          test -f "$source_dir/ui-terminal/package-lock.json"
          test -f "$source_dir/ui-terminal/src/index.js"
          test -f "$source_dir/ui-terminal/src/image-support.js"
          test -f "$source_dir/ui-terminal/src/image-support.test.js"
          test -f "$source_dir/ui-terminal/scripts/build.mjs"
          test ! -e "$source_dir/ui-terminal/node_modules"
          test ! -e "$source_dir/src/workgate/ui_runtime"
          uv build --wheel "$source_dir" --out-dir /tmp/workgate-sdist-wheel
          rebuilt="$(find /tmp/workgate-sdist-wheel -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$rebuilt"
          test "$(find /tmp/workgate-sdist-wheel -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          [[ "${rebuilt##*/}" == *-py3-none-any.whl ]]
      - name: Install wheel in a clean virtualenv
        run: |
          python -m venv /tmp/workgate-wheel-venv
          /tmp/workgate-wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/workgate-wheel-venv/bin/python -m pip install dist/*.whl
          /tmp/workgate-wheel-venv/bin/workgate --version
          /tmp/workgate-wheel-venv/bin/workgate version

  release-matrix:
    name: Release matrix check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python scripts/validation/check-release-matrix.py
