name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui-terminal/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pyright

  test:
    name: Test (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest -q -m "not topology"

  windows-native:
    name: Native Windows tests (x86-64, Python 3.14)
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: x64
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Verify WinPTY, UI Automation and Windows native contracts
        run: |
          uv run python -c "import winpty, uiautomation; print('Windows native dependencies imported')"
          uv run pytest -q tests/contracts/test_windows_conpty_core.py tests/contracts/test_windows_file_lock.py tests/contracts/test_windows_shell_dialect.py tests/contracts/test_windows_subprocess_env.py tests/contracts/test_windows_path.py tests/contracts/test_windows_native_runner.py tests/executor/test_windows_services.py tests/executor/test_windows_gui.py tests/executor/test_windows_gui_edges.py tests/executor/test_windows_gui_desktop.py tests/executor/test_windows_capture.py
      - name: Native Control, Executor and concurrent ConPTY WebUI E2E
        run: uv run python scripts/validation/windows-conpty-transport-smoke.py
      - name: Native per-user Task Scheduler and child cleanup E2E
        run: uv run python scripts/validation/windows-user-service-smoke.py
      - name: Native Windows CLI owner pairing approval and denial E2E
        run: uv run python scripts/validation/windows-pairing-approval-smoke.py
      - name: Native paired Task Scheduler Executor lifecycle and reconnect E2E
        run: uv run python scripts/validation/windows-paired-service-smoke.py
      - name: Verify clean Windows wheel installation
        shell: pwsh
        run: |
          uv build --wheel --out-dir dist
          $wheel = (Get-ChildItem dist -Filter '*.whl' | Select-Object -First 1).FullName
          $environment = Join-Path $env:RUNNER_TEMP 'wg391-wheel'
          uv venv --python 3.14 $environment
          uv pip install --python (Join-Path $environment 'Scripts/python.exe') $wheel
          & (Join-Path $environment 'Scripts/workgate.exe') --version


  topology:
    name: Deployment topology
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev --extra s3
      - name: Run real-process deployment topologies
        run: uv run pytest -q -m topology --basetemp=topology-artifacts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: deployment-topology-logs
          path: topology-artifacts
          if-no-files-found: ignore
          retention-days: 14

  coverage:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Install locked Chromium revision
        run: uv run playwright install --with-deps chromium
      - name: Run branch coverage
        run: |
          find . -maxdepth 1 -name '.coverage*' -delete
          uv run python -m coverage run -m pytest -q -m "not topology"
          uv run python -m coverage combine
          uv run python -m coverage json
          uv run python -m coverage xml
          uv run python -m coverage report
          uv run python scripts/validation/check-coverage.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-coverage
          path: |
            coverage.json
            coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  browser-e2e:
    name: Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install terminal runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux
      - run: uv sync --locked --group dev
      - name: Install locked Chromium revision
        run: uv run playwright install --with-deps chromium
      - name: Run structured browser tool E2E
        run: uv run pytest -q -m browser tests/webui/test_browser_service.py
      - name: Run real Chromium Human UI scenario
        run: uv run python scripts/testing/run-browser-e2e.py --artifacts browser-artifacts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: chromium-human-ui-e2e
          path: browser-artifacts
          if-no-files-found: warn
          retention-days: 14

  binary-smoke:
    name: Self-contained binary (${{ matrix.artifact }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: linux-x86_64
            runner: ubuntu-latest
          - artifact: linux-aarch64
            runner: ubuntu-24.04-arm
          - artifact: macos-x86_64
            runner: macos-15-intel
          - artifact: macos-aarch64
            runner: macos-15
          - artifact: windows-x86_64
            runner: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - if: runner.os != 'Windows'
        run: bash scripts/release/build-binary.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/release/build-binary.ps1
      - if: runner.os != 'Windows'
        run: python scripts/release/smoke-binary.py dist/workgate
      - if: runner.os == 'Windows'
        run: python scripts/release/smoke-binary.py dist/workgate.exe
      - if: runner.os == 'Windows'
        run: uv run pytest -q tests/contracts/test_windows_frozen_service.py
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/release/package-windows.ps1
      - name: Build distinct acceptance-only older Windows frozen PE
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/validation/build-windows-older-frozen.ps1
      - name: Native frozen Windows PowerShell bootstrap and automatic cross-version update E2E
        if: runner.os == 'Windows'
        run: uv run python scripts/validation/windows-frozen-bootstrap-smoke.py --older-service dist/workgatew-older.exe

  package-smoke:
    name: Package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv build --out-dir dist
      - name: Check universal wheel and source distribution
        run: python scripts/validation/check-python-dist.py dist
      - name: Validate source distribution contents and rebuild
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/workgate-sdist /tmp/workgate-sdist-wheel
          mkdir -p /tmp/workgate-sdist /tmp/workgate-sdist-wheel
          tar -xzf dist/*.tar.gz -C /tmp/workgate-sdist
          source_dir="$(find /tmp/workgate-sdist -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test ! -e "$source_dir/scripts/release/pyinstaller-entry.py"
          test ! -e "$source_dir/scripts/pyinstaller-entry.py"
          test ! -e "$source_dir/scripts/testing/run-browser-e2e.py"
          test ! -e "$source_dir/scripts/run-browser-e2e.py"
          test -f "$source_dir/scripts/README.md"
          test -f "$source_dir/scripts/validation/check-coverage.py"
          test -f "$source_dir/scripts/validation/check-release-matrix.py"
          test -f "$source_dir/scripts/validation/check-python-dist.py"
          test -f "$source_dir/deploy/cloudflared/README.md"
          test -f "$source_dir/deploy/cloudflared/workgate-cloudflared.service"
          test -f "$source_dir/scripts/validation/coverage-baseline.json"
          test -f "$source_dir/tests/repo/test_coverage_gate.py"
          test -f "$source_dir/tests/executor/test_tmux_helper.py"
          test ! -e "$source_dir/.coverage"
          test ! -e "$source_dir/coverage.json"
          test ! -e "$source_dir/coverage.xml"
          test -f "$source_dir/ui-terminal/package.json"
          test -f "$source_dir/ui-terminal/package-lock.json"
          test -f "$source_dir/ui-terminal/src/index.js"
          test -f "$source_dir/ui-terminal/src/image-support.js"
          test -f "$source_dir/ui-terminal/src/image-support.test.js"
          test -f "$source_dir/ui-terminal/scripts/build.mjs"
          test ! -e "$source_dir/ui-terminal/node_modules"
          test ! -e "$source_dir/src/workgate/ui_runtime"
          uv build --wheel "$source_dir" --out-dir /tmp/workgate-sdist-wheel
          rebuilt="$(find /tmp/workgate-sdist-wheel -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$rebuilt"
          test "$(find /tmp/workgate-sdist-wheel -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          [[ "${rebuilt##*/}" == *-py3-none-any.whl ]]
      - name: Install wheel in a clean virtualenv
        run: |
          python -m venv /tmp/workgate-wheel-venv
          /tmp/workgate-wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/workgate-wheel-venv/bin/python -m pip install dist/*.whl
          /tmp/workgate-wheel-venv/bin/workgate --version
          /tmp/workgate-wheel-venv/bin/workgate version
      - name: Smoke pinned GitHub uvx and pipx installation
        shell: bash
        run: |
          set -euo pipefail
          # Validate Git-based installation, independently of the current PR's wheel smoke.
          package='git+https://github.com/${{ github.repository }}.git@v5.0.0a1'
          uvx --python 3.14 --from "$package" workgate --help >/dev/null
          export PIPX_HOME="${RUNNER_TEMP}/workgate-pipx-home"
          export PIPX_BIN_DIR="${RUNNER_TEMP}/workgate-pipx-bin"
          uvx --python 3.14 --from pipx pipx install "$package" --python python3.14
          "$PIPX_BIN_DIR/workgate" --version

  release-matrix:
    name: Release matrix check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python scripts/validation/check-release-matrix.py

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - pre-commit
      - pyright
      - test
      - windows-native
      - topology
      - coverage
      - browser-e2e
      - binary-smoke
      - package-smoke
      - release-matrix
    if: always()
    steps:
      - name: Require every CI job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ['JOB_RESULTS'])
          failures = {name: value['result'] for name, value in jobs.items() if value['result'] != 'success'}
          if failures:
              sys.exit(f'CI gate failed: {failures}')
          print('All CI jobs passed')
          PY
