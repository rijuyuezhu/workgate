name: Native ARM64 cryptography wheel (experimental)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/arm64-crypto-wheel.yml
      - scripts/release/build_arm64_crypto_wheel.ps1
      - scripts/release/download_arm64_crypto_sources.py
      - scripts/release/verify_arm64_crypto_wheel.py
      - scripts/release/smoke_arm64_crypto_wheel.py
      - uv.lock

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          architecture: arm64
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc
      - name: Build and verify pinned native ARM64 static wheel
        shell: pwsh
        run: ./scripts/release/build_arm64_crypto_wheel.ps1
      - name: Keep wheel + provenance for review only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cryptography-50.0.2-openssl-3.5.9-arm64-review-only
          path: ${{ runner.temp }}/workgate-crypto-wheel/wheel/
          retention-days: 7
          if-no-files-found: error
