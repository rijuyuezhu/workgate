name: Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v5.0.0a1 or v5.0.0"
        required: true
        type: string
      prerelease:
        description: "Force prerelease status; semantic prerelease tags are detected automatically"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHON_VERSION: "3.14"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate-release:
    name: Validate release input
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate tag and read project version
        id: version
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          REQUESTED_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(
              r"v?[0-9]+[.][0-9]+[.][0-9]+"
              r"(?P<pre>(?:a|b|rc)[0-9]+|-[0-9A-Za-z.-]+)?"
              r"(?P<local>[+][0-9A-Za-z.-]+)?",
              tag,
          )
          if match is None:
              raise SystemExit(
                  "Release tag must look like v5.0.0a1, v5.0.0rc1, or v5.0.0; "
                  f"got {tag!r}"
              )

          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]

          release_version = tag[1:] if tag.startswith("v") else tag
          if release_version != version:
              raise SystemExit(
                  f"Release tag {tag!r} resolves to version {release_version!r}, "
                  f"but pyproject.toml declares {version!r}"
              )

          requested_prerelease = os.environ["REQUESTED_PRERELEASE"].lower() == "true"
          prerelease = match.group("pre") is not None or requested_prerelease
          print(f"version={version}")
          print(f"prerelease={'true' if prerelease else 'false'}")
          PY
  build-python-package:
    name: Build Python package
    runs-on: ubuntu-latest
    needs: validate-release
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --locked --group dev

      - name: Build wheel and source distribution
        run: uv build

      - name: Check universal wheel and source distribution
        run: python scripts/validation/check-python-dist.py dist

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  build-binary:
    name: Build binary (${{ matrix.artifact }})
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: linux-x86_64
            runner: ubuntu-latest
            binary: workgate
            archive: tar.gz
          - artifact: linux-aarch64
            runner: ubuntu-24.04-arm
            binary: workgate
            archive: tar.gz
          - artifact: macos-x86_64
            runner: macos-15-intel
            binary: workgate
            archive: tar.gz
          - artifact: macos-aarch64
            runner: macos-15
            binary: workgate
            archive: tar.gz
          - artifact: windows-x86_64
            runner: windows-latest
            binary: workgate.exe
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build self-contained executable
        shell: bash
        run: |
          PYINSTALLER_ARGS=(
            --clean
            --onefile
            --name workgate
            --collect-all workgate
            --collect-all mcp
            --collect-all uvicorn
            --collect-all fastapi
            --collect-all starlette
            --exclude-module cryptography
          )
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            PYINSTALLER_ARGS+=(--collect-all winpty)
          fi
          uv run --extra gui --with pyinstaller --with typer pyinstaller \
            "${PYINSTALLER_ARGS[@]}" \
            scripts/release/pyinstaller-entry.py

      - name: Smoke test executable
        shell: bash
        run: ./dist/${{ matrix.binary }} --help

      - name: Package executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/workgate-${{ matrix.artifact }}
          cp dist/${{ matrix.binary }} release/workgate-${{ matrix.artifact }}/
          cp README.md LICENSE release/workgate-${{ matrix.artifact }}/
          cat > release/workgate-${{ matrix.artifact }}/QUICKSTART.txt <<'EOF'
          Start the Workgate control:

            ./workgate control --mode mcp

          Pair an executor in another terminal, then run it:

            ./workgate executor connect http://127.0.0.1:8765
            ./workgate executor run --default-workdir /path/to/workspace

          POSIX persistent shells require tmux on the executor host.

          Open the browser UI by starting control in HTTP mode and visiting /ui.

          Useful control environment variables:

            WORKGATE_HOST=127.0.0.1
            WORKGATE_PORT=8765
            WORKGATE_AUTH_MODE=oauth
            WORKGATE_BASE_URL=https://your-public-host.example.com
            WORKGATE_OAUTH_ADMIN_PIN=change-me
            WORKGATE_OAUTH_JWT_SECRET=change-me-64-hex-random-secret

          Workspace and machine policy belong to the executor, not the control.
          EOF
          cd release
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a workgate-${{ matrix.artifact }}.zip workgate-${{ matrix.artifact }} >/dev/null
          else
            tar -czf workgate-${{ matrix.artifact }}.tar.gz workgate-${{ matrix.artifact }}
          fi

      - name: Generate binary checksums
        shell: bash
        run: |
          cd release
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum workgate-${{ matrix.artifact }}.* > workgate-${{ matrix.artifact }}.sha256
          else
            shasum -a 256 workgate-${{ matrix.artifact }}.* > workgate-${{ matrix.artifact }}.sha256
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.artifact }}
          path: |
            release/workgate-${{ matrix.artifact }}.*
          if-no-files-found: error
  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - validate-release
      - build-python-package
      - build-binary
    steps:
      - name: Download Python package artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Create combined checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Create release notes
        run: |
          cat > RELEASE_NOTES.md <<EOF
          One universal \`py3-none-any\` Python wheel and one source distribution are attached.

          All-in-one executable downloads are attached for:

          \`\`\`text
          linux-x86_64
          linux-aarch64
          macos-x86_64
          macos-aarch64
          windows-x86_64
          \`\`\`

          Start the standalone executable:

          \`\`\`bash
          ./workgate control --mode mcp
          \`\`\`

          Universal Python package artifacts, executable archives, and SHA256 checksums are attached below.

          Python package version in \`pyproject.toml\`: \`${{ needs.validate-release.outputs.version }}\`
          EOF

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.validate-release.outputs.prerelease }}
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          files: dist/*
