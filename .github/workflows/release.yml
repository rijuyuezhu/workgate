name: Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v5.0.0a3 or v5.0.0"
        required: true
        type: string
      prerelease:
        description: "Force prerelease status; semantic prerelease tags are detected automatically"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHON_VERSION: "3.14"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate-release:
    name: Validate release input
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate tag and read project version
        id: version
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          REQUESTED_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(
              r"v?[0-9]+[.][0-9]+[.][0-9]+"
              r"(?P<pre>(?:a|b|rc)[0-9]+|-[0-9A-Za-z.-]+)?"
              r"(?P<local>[+][0-9A-Za-z.-]+)?",
              tag,
          )
          if match is None:
              raise SystemExit(
                  "Release tag must look like v5.0.0a1, v5.0.0rc1, or v5.0.0; "
                  f"got {tag!r}"
              )

          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]

          release_version = tag[1:] if tag.startswith("v") else tag
          if release_version != version:
              raise SystemExit(
                  f"Release tag {tag!r} resolves to version {release_version!r}, "
                  f"but pyproject.toml declares {version!r}"
              )

          requested_prerelease = os.environ["REQUESTED_PRERELEASE"].lower() == "true"
          prerelease = match.group("pre") is not None or requested_prerelease
          print(f"version={version}")
          print(f"prerelease={'true' if prerelease else 'false'}")
          PY
      - name: Require current main and successful CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/validation/check-release-provenance.py
  build-python-package:
    name: Build Python package
    runs-on: ubuntu-latest
    needs: validate-release
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --locked --group dev

      - name: Build wheel and source distribution
        run: uv build

      - name: Check universal wheel and source distribution
        run: python scripts/validation/check-python-dist.py dist

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  build-arm64-cryptography:
    name: Build native ARM64 cryptography wheel
    runs-on: windows-11-arm
    needs: validate-release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: arm64
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc
      - name: Build and verify pinned native wheel
        shell: pwsh
        run: ./scripts/release/build_arm64_crypto_wheel.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: arm64-cryptography
          path: ${{ runner.temp }}/workgate-crypto-wheel/wheel/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    needs:
      - validate-release
      - build-python-package
      - build-arm64-cryptography
    steps:
      - uses: actions/checkout@v6
      - name: Download Python package artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Download verified native ARM64 cryptography wheel
        uses: actions/download-artifact@v8
        with:
          name: arm64-cryptography
          path: dist

      - name: Create combined checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Create release notes
        run: |
          cat > RELEASE_NOTES.md <<EOF
          One universal \`py3-none-any\` Python wheel and one source distribution are attached.

          This is a source + uv release, not a standalone executable release.
          Use a pinned Git release and the official Linux or Windows
          source bootstrap in the installation guide.

          Upgrade order matters: migrate paired legacy frozen Executors
          to managed source BEFORE upgrading Control to this release.
          The old binary download/update endpoints are retired; an
          unmigrated frozen Executor will require explicit owner action.
          See docs/guides/migrate-frozen.md.

          A native Windows ARM64 cryptography wheel and its provenance are included.
          Its checksum is recorded in SHA256SUMS.txt.

          The universal Python wheel and source distribution are also attached.

          Python package version in \`pyproject.toml\`: \`${{ needs.validate-release.outputs.version }}\`
          EOF

      - name: Recheck current main and successful CI before publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/validation/check-release-provenance.py

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.validate-release.outputs.prerelease }}
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          files: dist/*
