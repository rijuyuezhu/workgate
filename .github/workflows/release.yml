name: Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v5.0.0a1 or v5.0.0"
        required: true
        type: string
      prerelease:
        description: "Force prerelease status; semantic prerelease tags are detected automatically"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHON_VERSION: "3.14"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate-release:
    name: Validate release input
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate tag and read project version
        id: version
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          REQUESTED_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(
              r"v?[0-9]+[.][0-9]+[.][0-9]+"
              r"(?P<pre>(?:a|b|rc)[0-9]+|-[0-9A-Za-z.-]+)?"
              r"(?P<local>[+][0-9A-Za-z.-]+)?",
              tag,
          )
          if match is None:
              raise SystemExit(
                  "Release tag must look like v5.0.0a1, v5.0.0rc1, or v5.0.0; "
                  f"got {tag!r}"
              )

          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]

          release_version = tag[1:] if tag.startswith("v") else tag
          if release_version != version:
              raise SystemExit(
                  f"Release tag {tag!r} resolves to version {release_version!r}, "
                  f"but pyproject.toml declares {version!r}"
              )

          requested_prerelease = os.environ["REQUESTED_PRERELEASE"].lower() == "true"
          prerelease = match.group("pre") is not None or requested_prerelease
          print(f"version={version}")
          print(f"prerelease={'true' if prerelease else 'false'}")
          PY
  build-python-package:
    name: Build Python package
    runs-on: ubuntu-latest
    needs: validate-release
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --locked --group dev

      - name: Build wheel and source distribution
        run: uv build

      - name: Inspect universal wheel and source distribution
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          from workgate.release.platform_wheel import inspect_sdist, inspect_wheel

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit("expected exactly one universal wheel and one sdist")
          inspect_wheel(wheels[0], target=None)
          inspect_sdist(sdists[0])
          PY

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  build-platform-wheel:
    name: Build platform wheel (${{ matrix.artifact }})
    needs: validate-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: linux-x86_64
            runner: ubuntu-latest
            platform_tag: linux_x86_64
          - artifact: linux-aarch64
            runner: ubuntu-24.04-arm
            platform_tag: linux_aarch64
          - artifact: macos-x86_64
            runner: macos-15-intel
            platform_tag: macosx_10_15_x86_64
          - artifact: macos-aarch64
            runner: macos-15
            platform_tag: macosx_11_0_arm64
          - artifact: windows-x86_64
            runner: windows-latest
            platform_tag: win_amd64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: uv sync --locked --group dev

      - working-directory: ui-opentui
        run: bun install --frozen-lockfile

      - name: Build and inspect platform wheel
        shell: bash
        run: >-
          uv run python scripts/release/build-platform-wheel.py
          --platform-tag "${{ matrix.platform_tag }}"
          --output-dir dist

      - name: Install wheel without Bun or sidecar
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/platform-wheel-venv"
          state="$RUNNER_TEMP/platform-wheel-state"
          work="$RUNNER_TEMP/platform-wheel-work"
          python -m venv "$venv"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python_bin="$venv/Scripts/python.exe"
            clean_path="$venv/Scripts"
          else
            python_bin="$venv/bin/python"
            clean_path="$venv/bin"
          fi
          "$python_bin" -m pip install dist/*.whl
          PATH="$clean_path" "$python_bin" \
            "$GITHUB_WORKSPACE/scripts/release/smoke-platform-wheel.py" \
            --state-dir "$state" \
            --work-dir "$work"
          test ! -e src/workgate/ui_runtime
          test ! -e src/workgate/.platform-wheel-build.lock

      - uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error

  build-binary:
    name: Build binary (${{ matrix.artifact }})
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: linux-x86_64
            runner: ubuntu-latest
            binary: workgate
            archive: tar.gz
          - artifact: linux-aarch64
            runner: ubuntu-24.04-arm
            binary: workgate
            archive: tar.gz
          - artifact: macos-x86_64
            runner: macos-15-intel
            binary: workgate
            archive: tar.gz
          - artifact: macos-aarch64
            runner: macos-15
            binary: workgate
            archive: tar.gz
          - artifact: windows-x86_64
            runner: windows-latest
            binary: workgate.exe
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build OpenTUI sidecar
        working-directory: ui-opentui
        run: |
          bun install --frozen-lockfile
          bun run build:tui

      - name: Build self-contained executable
        shell: bash
        run: |
          PYINSTALLER_ARGS=(
            --clean
            --onefile
            --name workgate
            --collect-all workgate
            --collect-all mcp
            --collect-all uvicorn
            --collect-all fastapi
            --collect-all starlette
            --exclude-module cryptography
          )
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            PYINSTALLER_ARGS+=(--collect-all winpty)
          fi
          uv run --with pyinstaller --with typer pyinstaller \
            "${PYINSTALLER_ARGS[@]}" \
            scripts/release/pyinstaller-entry.py

      - name: Smoke test executables
        shell: bash
        run: |
          ./dist/${{ matrix.binary }} --help
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            ./ui-opentui/dist/workgate-tui.exe --version
          else
            ./ui-opentui/dist/workgate-tui --version
          fi

      - name: Package executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/workgate-${{ matrix.artifact }}
          cp dist/${{ matrix.binary }} release/workgate-${{ matrix.artifact }}/
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            cp ui-opentui/dist/workgate-tui.exe release/workgate-${{ matrix.artifact }}/
          else
            cp ui-opentui/dist/workgate-tui release/workgate-${{ matrix.artifact }}/
          fi
          cp README.md LICENSE release/workgate-${{ matrix.artifact }}/
          cp src/workgate/helpers/opentui.NOTICES \
            release/workgate-${{ matrix.artifact }}/OPENTUI-NOTICES.txt
          cp src/workgate/helpers/bun-1.3.14.LICENSE.md \
            release/workgate-${{ matrix.artifact }}/BUN-1.3.14-LICENSE.md
          cat > release/workgate-${{ matrix.artifact }}/QUICKSTART.txt <<'EOF'
          Start the Workgate control:

            ./workgate control --mode mcp

          Pair an executor in another terminal, then run it:

            ./workgate executor connect http://127.0.0.1:8765
            ./workgate executor run --workspace-root /path/to/workspace

          POSIX persistent shells require tmux on the executor host.

          Open the native terminal UI in another terminal:

            ./workgate tui

          Useful control environment variables:

            WORKGATE_HOST=127.0.0.1
            WORKGATE_PORT=8765
            WORKGATE_AUTH_MODE=oauth
            WORKGATE_BASE_URL=https://your-public-host.example.com
            WORKGATE_OAUTH_ADMIN_PIN=change-me
            WORKGATE_OAUTH_JWT_SECRET=change-me-64-hex-random-secret

          Workspace and machine policy belong to the executor, not the control.
          EOF
          cd release
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a workgate-${{ matrix.artifact }}.zip workgate-${{ matrix.artifact }} >/dev/null
          else
            tar -czf workgate-${{ matrix.artifact }}.tar.gz workgate-${{ matrix.artifact }}
          fi

      - name: Generate binary checksums
        shell: bash
        run: |
          cd release
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum workgate-${{ matrix.artifact }}.* > workgate-${{ matrix.artifact }}.sha256
          else
            shasum -a 256 workgate-${{ matrix.artifact }}.* > workgate-${{ matrix.artifact }}.sha256
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.artifact }}
          path: |
            release/workgate-${{ matrix.artifact }}.*
          if-no-files-found: error
  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - validate-release
      - build-python-package
      - build-platform-wheel
      - build-binary
    steps:
      - uses: actions/checkout@v6

      - name: Download Python package artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Download platform wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: python-wheel-*
          path: dist
          merge-multiple: true

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Create combined checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Create release notes
        run: |
          cat > RELEASE_NOTES.md <<EOF
          Embedded-OpenTUI Python wheels are attached for:

          \`\`\`text
          linux-x86_64
          linux-aarch64
          macos-x86_64
          macos-aarch64
          windows-x86_64
          \`\`\`

          Linux wheels use truthful native \`linux_*\` tags; they do not claim manylinux compatibility.
          The universal \`py3-none-any\` wheel and source distribution remain payload-free.

          All-in-one executable downloads are attached for:

          \`\`\`text
          linux-x86_64
          linux-aarch64
          macos-x86_64
          macos-aarch64
          windows-x86_64
          \`\`\`

          Start the standalone executable:

          \`\`\`bash
          ./workgate control --mode mcp
          \`\`\`

          Universal and platform Python package artifacts, executable archives, and SHA256 checksums are attached below.

          Python package version in \`pyproject.toml\`: \`${{ needs.validate-release.outputs.version }}\`
          EOF

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.validate-release.outputs.prerelease }}
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          files: dist/*
