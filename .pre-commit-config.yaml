repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: generate-config-examples
        name: generate config examples
        entry: uv run python scripts/generation/generate-config-examples.py
        language: system
        pass_filenames: false
        files: ^(src/workgate/config/(settings|surface)\.py|scripts/generation/generate-config-examples\.py|\.env\.example|config\.example\.yaml|docs/reference/generated/configuration\.json)$
      - id: generate-tools-reference
        name: generate tools reference
        entry: uv run python scripts/generation/export-tools-json.py --wrapped --output docs/reference/generated/tools.json --instructions-output docs/reference/generated/server-instructions.json
        language: system
        pass_filenames: false
        files: ^(src/workgate/.*\.py|scripts/generation/export-tools-json\.py|docs/reference/generated/(tools|server-instructions)\.json)$
      - id: terminal-ui-build
        name: terminal UI generated assets
        entry: bash -c 'cd ui-terminal && npm ci && npm run check'
        language: system
        pass_filenames: false
        files: ^(ui-terminal/(src/.*\.js|scripts/.*\.mjs|package(-lock)?\.json)|src/workgate/ui/static/xterm(_bundle\.js|\.css|\.LICENSE\.txt))$

      - id: generate-tui-executable-contract
        name: generate TUI executable contract
        entry: uv run python scripts/generation/generate-tui-executable-contract.py --check
        language: system
        pass_filenames: false
        files: ^(src/workgate/ui/contracts\.py|scripts/generation/generate-tui-executable-contract\.py|ui-opentui/scripts/(compile-tui|executable-contract)\.ts)$

      - id: native-artifact-provenance
        name: native artifact provenance
        entry: uv run python scripts/validation/check-native-provenance.py
        language: system
        pass_filenames: false
        files: ^(ui-opentui/(package\.json|bun\.lock|scripts/(compile-tui|executable-contract)\.ts)|scripts/release/(build-platform-wheel\.py|smoke-platform-wheel\.py)|scripts/generation/generate-tui-executable-contract\.py|scripts/validation/(check-native-provenance\.py|check-release-matrix\.py)|src/workgate/(ui/contracts\.py|helpers/(opentui\.NOTICES|bun-1\.3\.14\.LICENSE\.md))|docs/maintenance/native-artifact-provenance\.md|pyproject\.toml|mkdocs\.yml|\.github/workflows/(ci|release)\.yml)$
