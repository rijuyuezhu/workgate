site_name: Workgate
site_description: Connect MCP clients to workspaces on your computers
site_url: https://project.rijuyuezhu.top/workgate/
repo_url: https://github.com/rijuyuezhu/workgate
repo_name: rijuyuezhu/workgate
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - assets/reference-renderer.js

nav:
  - Home: index.md
  - Get started:
      - Quickstart: getting-started/quickstart.md
      - Install Workgate: getting-started/install-options.md
      - Connect ChatGPT: getting-started/chatgpt-connector.md
      - Connect an MCP client: getting-started/mcp-clients.md
      - Choose a deployment: getting-started/deployment.md
  - Use Workgate:
      - Common workflows: guides/common-workflows.md
      - WebUI: guides/webui.md
      - Executors: guides/executors.md
      - Skills and MCP integrations: guides/agent-bridge.md
  - Operations:
      - VPS deployment: getting-started/vps.md
      - Migrate an older installation: guides/migrate-frozen.md
      - Audit log: guides/audit-log.md
      - Troubleshooting: troubleshooting.md
      - Security: security.md
  - Reference:
      - CLI: reference/cli.md
      - Configuration: reference/configuration.md
      - Tools: reference/tools.md
  - Development:
      - Development guide: development.md
      - Colocate from source: getting-started/colocate.md
      - Control service from source: getting-started/control-service.md
      - Windows platform: maintenance/windows-platform-backends.md
