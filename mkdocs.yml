site_name: Workgate
site_description: Self-hosted workspace control plane for coding agents
site_url: https://project.rijuyuezhu.top/workgate/
repo_url: https://github.com/rijuyuezhu/workgate
repo_name: rijuyuezhu/workgate
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - assets/reference-renderer.js

nav:
  - Home: index.md
  - Comparison with upstream: comparison.md
  - Getting started:
      - Quickstart: getting-started/quickstart.md
      - Cloudflare Tunnel: getting-started/cloudflare-tunnel.md
      - ChatGPT connector: getting-started/chatgpt-connector.md
      - Install options: getting-started/install-options.md
  - Guides:
      - Common workflows: guides/common-workflows.md
      - Human interface: guides/human-interface.md
      - Remote workers: guides/remote-workers.md
      - Agent capability bridge: guides/agent-bridge.md
      - Audit log: guides/audit-log.md
      - Example prompts: guides/example-prompts.md
  - Reference:
      - Configuration: reference/configuration.md
      - CLI: reference/cli.md
      - Tools: reference/tools.md
      - MCP server instructions: reference/instructions.md
  - Security: security.md
  - Troubleshooting: troubleshooting.md
  - Architecture:
      - Current implementation: architecture.md
      - Control/executor target: architecture/control-executor.md
  - Development: development.md
  - Maintenance:
      - Fork and upstream differences: maintenance/fork-upstream-differences.md
      - Upstream commit review: maintenance/upstream-commit-review.md
      - Native artifact provenance: maintenance/native-artifact-provenance.md
  - Community:
      - Contributing: community/contributing.md
      - Support: community/support.md
      - Security policy: community/security-policy.md
      - Code of conduct: community/code-of-conduct.md
